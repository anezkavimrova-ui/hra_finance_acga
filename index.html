<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanční hra Praha - Start</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container main-start">
        <div class="card">
            <h1>💸 Finanční hra: Praha</h1>
            <p>Vítejte v městské hře zaměřené na svět financí. Jste připraveni ovládnout pražskou burzu i směnárny?</p>
            
            <div class="input-group">
                <label for="teamInput">Zadejte číslo vašeho týmu</label>
                <input type="number" id="teamInput" placeholder="např. 1" min="1">
            </div>
            
            <button onclick="startHry()" class="btn-main">VYRAZIT DO TERÉNU</button>
        </div>
    </div>

    <script>
        function startHry() {
            const teamId = document.getElementById('teamInput').value;
            if (teamId > 0) {
                window.location.href = `hra.html?team=${teamId}`;
            } else {
                alert("Prosím zadejte platné číslo týmu!");
            }
        }
    </script>
</body>
</html>
