<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanční hra Praha | Amazon</title>
    <style>
        :root {
            --pink: #ff007f;
            --turquoise: #00f2ff;
            --black: #000000;
            --white: #ffffff;
        }

        body {
            font-family: 'Arial Black', Gadget, sans-serif;
            margin: 0;
            /* Pozadí tvořené sytým přechodem růžové a tyrkysové */
            background: linear-gradient(135deg, var(--pink) 0%, var(--turquoise) 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 5px;
            /* Černý detail - tenký rámeček kolem celé karty */
            background: var(--black);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .main-card {
            background: var(--white);
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            border: 4px solid var(--black);
        }

        .logo-box {
            margin-bottom: 20px;
        }

        .logo-box img {
            max-width: 200px;
            filter: drop-shadow(2px 2px 0px var(--turquoise));
        }

        .school-tag {
            background: var(--black);
            color: var(--turquoise);
            display: inline-block;
            padding: 5px 15px;
            font-size: 0.7rem;
            border-radius: 50px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            color: var(--black);
            font-size: 2.2rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
        }

        .pink-text {
            color: var(--pink);
            -webkit-text-stroke: 1px var(--black);
        }

        .description {
            color: var(--black);
            font-size: 0.9rem;
            font-weight: bold;
            margin: 20px 0;
            line-height: 1.3;
        }

        .input-section {
            background: var(--turquoise);
            border: 3px solid var(--black);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--black);
            font-size: 0.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        input[type="number"] {
            width: 80%;
            border: 3px solid var(--black);
            border-radius: 10px;
            padding: 10px;
            font-size: 2rem;
            text-align: center;
            font-family: 'Arial Black', sans-serif;
            background: var(--white);
        }

        .btn-start {
            background: var(--pink);
            color: var(--white);
            border: 3px solid var(--black);
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--black);
            transition: 0.1s;
        }

        .btn-start:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--black);
        }

        .footer {
            margin-top: 15px;
            font-size: 0.65rem;
            color: var(--black);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            
            <div class="logo-box">
                <img src="https://www.gymnazium-amazon.cz/mw1/themes/1/logo2018.png" alt="Logo Amazon">
            </div>

            <div class="school-tag">Anglicko-české gymnázium AMAZON</div>

            <h1>FINANČNÍ <span class="pink-text">HRA</span></h1>

            <p class="description">
                Tento projekt vznikl v rámci finančního vzdělávání na gymnáziu Amazon. 
                Vstup do světa peněz!
            </p>

            <div class="input-section">
                <label for="teamInput">Zadej číslo týmu:</label>
                <input type="number" id="teamInput" placeholder="0">
            </div>

            <button onclick="startHry()" class="btn-start">START 🚀</button>

            <div class="footer">
                © 2024 Anglicko české gymnázium AMAZON | MĚSTSKÁ HRA PRAHA
            </div>
        </div>
    </div>

    <script>
        function startHry() {
            const val = document.getElementById('teamInput').value;
            if (val > 0) {
                window.location.href = 'hra.html?team=' + val;
            } else {
                alert("Musíš zadat číslo týmu!");
            }
        }
    </script>
</body>
</html>
