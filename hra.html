<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hra: Finanční Praha | Amazon</title>
    <style>
        :root {
            --pink: #ff007f;
            --turquoise: #00f2ff;
            --black: #000000;
            --white: #ffffff;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, var(--turquoise) 0%, var(--pink) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Horní lišta s pokrokem */
        .header {
            background: var(--black);
            color: var(--turquoise);
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid var(--pink);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: #333;
        }

        .progress-bar {
            height: 100%;
            background: var(--turquoise);
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--turquoise);
        }

        .container {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .task-card {
            background: var(--white);
            border: 4px solid var(--black);
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 10px 10px 0px var(--black);
        }

        .location-tag {
            background: var(--pink);
            color: var(--white);
            display: inline-block;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            margin-bottom: 15px;
            border: 2px solid var(--black);
        }

        h2 {
            color: var(--black);
            margin: 0 0 15px 0;
            text-transform: uppercase;
            line-height: 1;
        }

        .task-content {
            color: var(--black);
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 25px;
            font-family: Arial, sans-serif; /* Pro lepší čitelnost delších textů */
        }

        .task-content strong {
            color: var(--pink);
            background: var(--black);
            padding: 0 5px;
        }

        .btn-next {
            background: var(--turquoise);
            color: var(--black);
            border: 3px solid var(--black);
            border-radius: 50px;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--black);
            transition: 0.1s;
        }

        .btn-next:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--black);
            background: var(--pink);
            color: var(--white);
        }

        .school-footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: var(--black);
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        Tým #<span id="displayTeamId">?</span> | Úkol <span id="currentStep">1</span>/8
    </div>
    
    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <div class="container">
        <div class="task-card">
            <div class="location-tag" id="locationName">Lokalita...</div>
            <h2 id="title">Načítání úkolu...</h2>
            
            <div id="content" class="task-content">
                </div>

            <div id="action-area">
                <button onclick="nextStep()" class="btn-next">MÁME HOTOVO! 🚀</button>
            </div>

            <div class="school-footer">
                Anglicko české gymnázium AMAZON • FINANČNÍ VZDĚLÁVÁNÍ
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
