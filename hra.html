<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hra: Finanční Praha | Amazon</title>
    <style>
        :root {
            --pink: #ff007f;
            --turquoise: #00f2ff;
            --black: #000000;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, var(--turquoise) 0%, var(--pink) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Horní lišta s pokrokem a celkovým časem */
        .header {
            background: var(--black);
            color: var(--turquoise);
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid var(--pink);
            font-size: 0.85rem;
            text-transform: uppercase;
            line-height: 1.4;
        }

        .header-stats {
            display: flex;
            justify-content: space-between;
            max-width: 450px;
            margin: 0 auto;
            padding: 0 10px;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: #333;
        }

        .progress-bar {
            height: 100%;
            background: var(--turquoise);
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--turquoise);
        }

        .container {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .task-card {
            background: var(--white);
            border: 4px solid var(--black);
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 10px 10px 0px var(--black);
            text-align: center;
        }

        .location-tag {
            background: var(--pink);
            color: var(--white);
            display: inline-block;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            margin-bottom: 15px;
            border: 2px solid var(--black);
            text-transform: uppercase;
        }

        h2 {
            color: var(--black);
            margin: 0 0 15px 0;
            text-transform: uppercase;
            line-height: 1.1;
            font-size: 1.4rem;
        }

        .task-content {
            color: var(--black);
            font-size: 1.05rem;
            line-height: 1.4;
            margin-bottom: 25px;
            font-family: Arial, sans-serif;
            text-align: left;
        }

        .ukol-ruzove {
            color: var(--pink) !important;
            background: transparent !important;
            font-weight: 900;
            text-transform: uppercase;
            padding: 0 !important;
            display: block;
            margin-bottom: 8px;
            font-family: 'Arial Black', sans-serif;
        }

        .timer-style {
            background: var(--black);
            color: var(--pink);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            margin: 20px 0;
            text-transform: uppercase;
            text-align: center;
        }

        .btn-arrived-style {
            background: var(--turquoise);
            color: var(--black);
            border: 3px solid var(--black);
            border-radius: 50px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--black);
            font-family: 'Arial Black', sans-serif;
            margin: 20px 0;
        }

        .btn-arrived-style:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--black);
        }

        .answer-box {
            background: var(--turquoise);
            border: 3px solid var(--black);
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }

        .answer-box label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .answer-box input {
            width: 100%;
            border: 2px solid var(--black);
            border-radius: 8px;
            padding: 8px;
            font-size: 1.6rem;
            text-align: center;
            font-weight: bold;
            font-family: 'Arial Black', sans-serif;
        }

        .media-box {
            border: 3px dashed var(--pink);
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
            background: #fff0f6;
            text-align: center;
        }

        .btn-upload {
            display: inline-block;
            background: var(--black);
            color: var(--turquoise);
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 2px solid var(--turquoise);
            margin-top: 5px;
        }

        .exchange-table-box {
            margin: 20px 0;
            border: 3px solid var(--black);
            border-radius: 12px;
            overflow: hidden;
        }

        .exchange-table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            background: var(--white);
        }

        .exchange-table th {
            background: var(--black);
            color: var(--turquoise);
            padding: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .exchange-table td {
            padding: 6px;
            border-bottom: 1px solid #ddd;
            font-size: 0.85rem;
        }

        .exchange-table input {
            width: 100%;
            padding: 5px;
            border: 1px solid var(--black);
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }

        .btn-next {
            background: var(--pink);
            color: var(--white);
            border: 3px solid var(--black);
            border-radius: 50px;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--black);
            font-family: 'Arial Black', sans-serif;
            transition: 0.1s;
        }

        .btn-next:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--black);
        }

        .school-footer {
            margin-top: 20px;
            font-size: 0.65rem;
            color: var(--black);
            text-align: center;
            font-weight: bold;
            opacity: 0.7;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-stats">
            <div>Tým #<span id="displayTeamId">?</span> | Stanoviště <span id="currentStep">1</span></div>
            <div>Čas: <span id="gameTimer" style="color: var(--pink);">00:00</span></div>
        </div>
    </div>
    
    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <div class="container">
        <div class="task-card">
            <div class="location-tag" id="locationName">Lokalita...</div>
            <h2 id="title">Načítání úkolu...</h2>
            
            <div id="content" class="task-content"></div>
            <div id="action-area"></div>

            <div class="school-footer">
                Anglicko-české gymnázium AMAZON<br>• FINANČNÍ VZDĚLÁVÁNÍ •
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
